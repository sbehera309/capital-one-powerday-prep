<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capital One PowerDay Tech & System Design Prep</title>
  <!-- Tailwind CSS CDN with dark mode support -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              750: '#1e293b',
              850: '#0f172a',
              950: '#020617'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-blue-500 selection:text-white">

  <!-- Top Global Header -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 space-y-2">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-xl">💳</span>
          <div>
            <h1 class="text-base sm:text-lg font-extrabold text-white leading-tight">Capital One PowerDay Interview Master Guide</h1>
            <p class="text-[11px] text-slate-400 font-medium">Recency-Sorted Case Studies, Animated System Design & Multi-Language Code</p>
          </div>
        </div>

        <!-- Global Language Selector for Code Blocks -->
        <div class="flex items-center gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs">
          <span class="text-[11px] text-slate-400 font-semibold px-2 hidden sm:inline">Code Language:</span>
          <button onclick="window.setGlobalLang('python')" id="lang-btn-python" class="px-2.5 py-1 rounded-lg text-xs font-bold transition-all bg-blue-600 text-white shadow-xs border border-blue-400">Python</button>
          <button onclick="window.setGlobalLang('go')" id="lang-btn-go" class="px-2.5 py-1 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white border border-transparent">Go</button>
          <button onclick="window.setGlobalLang('java')" id="lang-btn-java" class="px-2.5 py-1 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white border border-transparent">Java</button>
        </div>
      </div>

      <!-- Main Navigation Bar -->
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1 border-t border-slate-800 pt-2.5">
        <button onclick="window.switchTab('tech-cases')" id="tab-btn-tech-cases" class="flex-shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold transition-all bg-blue-600 text-white shadow-xs flex items-center gap-1.5 min-h-[38px]">
          <span>📋</span> <span>Tech Cases</span>
        </button>
        <button onclick="window.switchTab('tech-cheat-sheet')" id="tab-btn-tech-cheat-sheet" class="flex-shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-white flex items-center gap-1.5 min-h-[38px]">
          <span>🧩</span> <span>Tech Case Cheat Sheet</span>
        </button>
        <button onclick="window.switchTab('system-design')" id="tab-btn-system-design" class="flex-shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-white flex items-center gap-1.5 min-h-[38px]">
          <span>🏗️</span> <span>System Design</span>
        </button>
        <button onclick="window.switchTab('flashcards')" id="tab-btn-flashcards" class="flex-shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-white flex items-center gap-1.5 min-h-[38px]">
          <span>🎴</span> <span>Flashcards</span>
        </button>
        <button onclick="window.switchTab('mock-interview')" id="tab-btn-mock-interview" class="flex-shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-white flex items-center gap-1.5 min-h-[38px]">
          <span>⏱️</span> <span>Mock Interview</span>
        </button>
        <button onclick="window.switchTab('calculators')" id="tab-btn-calculators" class="flex-shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-white flex items-center gap-1.5 min-h-[38px]">
          <span>🧮</span> <span>Sizing Math</span>
        </button>
        <button onclick="window.switchTab('cheat-sheet')" id="tab-btn-cheat-sheet" class="flex-shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-white flex items-center gap-1.5 min-h-[38px]">
          <span>💡</span> <span>System Design Cheat Sheet</span>
        </button>
        <button onclick="window.switchTab('quiz')" id="tab-btn-quiz" class="flex-shrink-0 px-3.5 py-2 rounded-xl text-xs font-bold transition-all text-slate-400 hover:text-white flex items-center gap-1.5 min-h-[38px]">
          <span>⚡</span> <span>Practice Quiz</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="max-w-7xl mx-auto px-4 py-4 sm:py-6 space-y-4 sm:space-y-6">

    <!-- Global Search Bar -->
    <div class="bg-slate-850 border border-slate-800 p-2.5 sm:p-3 rounded-xl shadow-xs">
      <div class="relative">
        <input type="text" id="searchInput" onkeyup="window.filterContent()" placeholder="Search Technical Cases, System Design, APIs, Redis Lua, Flink, Kafka..." 
               class="w-full pl-9 pr-4 py-2 text-xs rounded-lg border border-slate-700 bg-slate-950 text-slate-100 focus:outline-none focus:ring-2 focus:ring-blue-500 min-h-[40px]">
        <svg class="w-4 h-4 absolute left-3 top-3 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>
    </div>

    <!-- TAB 1: TECHNICAL CASES -->
    <div id="tab-tech-cases" class="tab-content space-y-4" style="display: block;">
      <div class="block lg:hidden bg-slate-850 border border-slate-800 p-3 rounded-xl shadow-xs space-y-2">
        <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400 block">Select Case Study (Most Recent First):</label>
        <select id="mobile-case-select" onchange="window.selectCase(this.value)" class="w-full p-2.5 text-xs rounded-lg border border-slate-700 bg-slate-950 text-slate-100 font-semibold min-h-[44px]"></select>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
        <div class="hidden lg:block lg:col-span-1 space-y-2">
          <div class="flex items-center justify-between px-2 mb-2">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Technical Cases</h3>
            <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-blue-500/10 text-blue-400 border border-blue-500/30">Latest First</span>
          </div>
          <div id="tech-cases-sidebar" class="space-y-2"></div>
        </div>
        <div id="tech-cases-content" class="lg:col-span-3 space-y-6"></div>
      </div>
    </div>

    <!-- TAB 2: TECH CASE CHEAT SHEET -->
    <div id="tab-tech-cheat-sheet" class="tab-content space-y-6" style="display: none;"></div>

    <!-- TAB 3: SYSTEM DESIGN -->
    <div id="tab-system-design" class="tab-content space-y-4" style="display: none;">
      <div class="block lg:hidden bg-slate-850 border border-slate-800 p-3 rounded-xl shadow-xs space-y-2">
        <label class="text-[11px] font-bold uppercase tracking-wider text-slate-400 block">Select System Design Question:</label>
        <select id="mobile-sys-select" onchange="window.selectSysQ(this.value)" class="w-full p-2.5 text-xs rounded-lg border border-slate-700 bg-slate-950 text-slate-100 font-semibold min-h-[44px]"></select>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
        <div class="hidden lg:block lg:col-span-1 space-y-2">
          <div class="flex items-center justify-between px-2 mb-2">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">System Design</h3>
            <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-blue-500/10 text-blue-400 border border-blue-500/30">9 Questions</span>
          </div>
          <div id="system-design-sidebar" class="space-y-2"></div>
        </div>
        <div id="system-design-content" class="lg:col-span-3 space-y-6"></div>
      </div>
    </div>

    <!-- TAB 4: FLASHCARDS -->
    <div id="tab-flashcards" class="tab-content space-y-6" style="display: none;"></div>

    <!-- TAB 5: MOCK INTERVIEW -->
    <div id="tab-mock-interview" class="tab-content space-y-6" style="display: none;"></div>

    <!-- TAB 6: SIZING MATH CALCULATORS -->
    <div id="tab-calculators" class="tab-content space-y-6" style="display: none;"></div>

    <!-- TAB 7: SYSTEM DESIGN CHEAT SHEET -->
    <div id="tab-cheat-sheet" class="tab-content space-y-6" style="display: none;"></div>

    <!-- TAB 8: PRACTICE QUIZ -->
    <div id="tab-quiz" class="tab-content space-y-6" style="display: none;"></div>

  </main>

  <!-- ES6 Module Entry Point -->
  <script type="module" src="src/js/app.js"></script>
</body>
</html>
